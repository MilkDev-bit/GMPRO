name: Security — SCA · SBOM · Image scan

# A03-3 / A03-4 / CLD-3.
# IMPORTANTE (política anti-ruptura): TODO arranca en modo REPORT-ONLY (no rompe
# el pipeline aunque haya CVEs preexistentes sin parche). Primero se revisa el
# backlog inicial; para activar el GATE bloqueante, ver los comentarios "GATE:"
# de abajo y remediation-fase2.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # lunes 06:00 UTC — barrido semanal

# Mínimo privilegio (A03-1). security-events: write permite subir SARIF a la
# pestaña Security → Code scanning (visibilidad sin bloquear).
permissions:
  contents: read
  security-events: write
  actions: read            # requerido por codeql upload-sarif y el reusable de OSV

jobs:
  # ── SCA: vulnerabilidades en dependencias (lockfiles) ──────────────────────
  # Reusable workflow OFICIAL de OSV-Scanner (no un composite action como step).
  # Recorre package-lock.json / pubspec.lock, sube SARIF al Security tab él mismo.
  # report-only: fail-on-vuln=false (GATE: poner true para bloquear en vuln).
  sca-osv:
    name: SCA (OSV-Scanner)
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --recursive
        ./
      fail-on-vuln: false
      # El repo no tiene GitHub Code Security → NO subir SARIF al Security tab
      # (fallaría). Report-only: resultados visibles en los logs del job.
      # Para reactivar la integración con Security tab: upload-sarif: true
      # (requiere repo público o GitHub Advanced Security).
      upload-sarif: false

  # ── npm audit por servicio (report-only) ───────────────────────────────────
  npm-audit:
    name: npm audit (report-only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/auth-service
          - services/access-service
          - services/payment-service
          - services/fitness-service
          - services/ai-service
          - packages_shared
          - apps/admin-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: npm audit --omit=dev (report; GATE con --audit-level=high)
        working-directory: ${{ matrix.service }}
        run: |
          npm audit --omit=dev --audit-level=high || \
            echo "::warning::Vulnerabilidades detectadas en ${{ matrix.service }} (report-only; ver backlog antes de activar el gate)"

  # ── SBOM CycloneDX por componente (adjunto como artefacto) ─────────────────
  sbom:
    name: SBOM (Syft · CycloneDX)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # path = qué escanear; name = etiqueta SIN '/' (el artifact-name no admite
        # barras: rompía la ruta temporal → ENOENT sbom-services/...).
        include:
          - { path: services/auth-service,    name: auth-service }
          - { path: services/access-service,  name: access-service }
          - { path: services/payment-service, name: payment-service }
          - { path: services/fitness-service, name: fitness-service }
          - { path: services/ai-service,      name: ai-service }
          - { path: apps/admin-web,           name: admin-web }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Generar SBOM CycloneDX
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ matrix.path }}
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.name }}.cdx.json
      # En un tag de release, adjuntar el SBOM al release lo hace sbom-action
      # automáticamente si el evento es 'release'; aquí queda como artefacto del run.

  # ── Escaneo de IMÁGENES Docker construidas (Trivy) ─────────────────────────
  # Solo en despliegue manual o tags (construir 5 imágenes es costoso en cada push).
  image-scan:
    name: Trivy image (report-only)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, access-service, payment-service, fitness-service, ai-service]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t gympro/${{ matrix.service }}:scan .
      - name: Trivy scan (report-only)
        # TODO pin SHA (rate limit al resolver): git ls-remote https://github.com/aquasecurity/trivy-action refs/tags/0.28.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gympro/${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"   # GATE: poner "1" para bloquear en HIGH/CRITICAL
      # El repo no tiene GitHub Code Security → guardamos el SARIF como ARTEFACTO
      # descargable en vez de subirlo al Security tab (que fallaría). Para volver
      # a la integración con Security tab, sustituir por github/codeql-action/upload-sarif.
      - name: Guardar SARIF de Trivy (artefacto)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-${{ matrix.service }}.sarif
          path: trivy-${{ matrix.service }}.sarif
          if-no-files-found: warn
