name: CI — Integration (Postgres + Redis reales)

# Valida propiedades que solo emergen contra infraestructura real: la ATOMICIDAD
# del consumo de refresh tokens bajo concurrencia (race conditions). Levanta
# Postgres y Redis efímeros y corre los tests de tests/integration/ con la BD real.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    name: auth-service integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Presencia de DATABASE_URL activa los tests de tests/integration/ (si no,
      # se auto-saltan). Redis disponible para futuros tests de integración.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/auth_test
      REDIS_URL:    redis://localhost:6379

    defaults:
      run:
        working-directory: services/auth-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/auth-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `pg` no está en las deps de runtime (el servicio usa supabase-js). Se
      # añade solo para el test de integración, sin tocar package.json/lock.
      - name: Install pg (solo para integración)
        run: npm install --no-save pg

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then echo "postgres listo"; exit 0; fi
            echo "esperando postgres... ($i)"; sleep 2
          done
          echo "postgres no respondió a tiempo"; exit 1

      - name: Run integration tests (concurrencia contra BD real)
        run: npx jest tests/integration --runInBand --forceExit
