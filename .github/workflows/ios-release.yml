name: iOS Release (TestFlight)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Mínimo privilegio: checkout + subir artefactos del run (no crea releases ni push).
permissions:
  contents: read

defaults:
  run:
    working-directory: apps/gym_mobile_app

jobs:
  ios:
    name: Build & Deploy IPA
    runs-on: macos-14   # runner con Xcode
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Setup Ruby (Fastlane)
        # TODO pin SHA (rate limit al resolver): git ls-remote https://github.com/ruby/setup-ruby refs/tags/v1
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/gym_mobile_app/ios

      # ── Decodificación de secretos ───────────────────────────────────────────
      - name: Decode secrets
        env:
          IOS_DIST_CERT_BASE64:          ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_PROVISION_PROFILE_BASE64:  ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          APPSTORE_API_KEY_P8_BASE64:    ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          GOOGLESERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_BASE64 }}
          DART_DEFINE_PROD_BASE64:       ${{ secrets.DART_DEFINE_PROD_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p env ios/certs ios/private_keys
          echo "$IOS_DIST_CERT_BASE64"          | base64 -d > ios/certs/dist.p12
          echo "$IOS_PROVISION_PROFILE_BASE64"  | base64 -d > ios/certs/profile.mobileprovision
          echo "$APPSTORE_API_KEY_P8_BASE64"    | base64 -d > ios/private_keys/AuthKey.p8
          echo "$GOOGLESERVICE_INFO_PLIST_BASE64" | base64 -d > ios/Runner/GoogleService-Info.plist
          echo "$DART_DEFINE_PROD_BASE64"        | base64 -d > env/prod.json

      # ── Keychain TEMPORAL: importa el certificado de distribución ────────────
      # Alternativa recomendada a escala: fastlane `match` (repo git cifrado con
      # los certs). Aquí usamos keychain efímero para un pipeline autocontenido.
      - name: Setup signing (temp keychain + profile)
        env:
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD:      ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import ios/certs/dist.p12 -k "$KEYCHAIN" \
            -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Instalar el perfil de aprovisionamiento
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp ios/certs/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Flutter pub get
        run: flutter pub get

      - name: Codegen (Isar)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: CocoaPods install
        run: pod install --project-directory=ios

      # ── Build del IPA OFUSCADO ───────────────────────────────────────────────
      # ExportOptions.plist debe indicar teamId, método (app-store) y el mapeo de
      # bundleId → nombre del perfil. Ver instrucciones (crear ios/ExportOptions.plist).
      - name: Build IPA (release, obfuscated)
        run: |
          flutter build ipa --release \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define-from-file=env/prod.json \
            --export-options-plist=ios/ExportOptions.plist

      - name: Fastlane beta → TestFlight
        working-directory: apps/gym_mobile_app/ios
        env:
          APPSTORE_KEY_ID:    ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: bundle exec fastlane beta

      - name: Upload debug symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-debug-symbols
          path: apps/gym_mobile_app/build/symbols
          retention-days: 90

      # ── CERO FILTRACIONES: borrar secretos y el keychain temporal SIEMPRE ────
      - name: Cleanup secrets & keychain
        if: always()
        run: |
          rm -f ios/certs/dist.p12 \
                ios/certs/profile.mobileprovision \
                ios/private_keys/AuthKey.p8 \
                ios/Runner/GoogleService-Info.plist \
                env/prod.json
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision || true
          echo "Secretos y keychain temporal eliminados."
