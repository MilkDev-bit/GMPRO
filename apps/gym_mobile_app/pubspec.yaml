name: gym_mobile_app
description: Aplicación móvil oficial de GymPro (Clean Architecture + Autenticación Nativa Apple/Google + Diseño Neón Sport)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Autenticación Nativa Oficial (Pub.dev) ──────────────────────────────────
  google_sign_in: ^6.2.1          # Inicio de sesión nativo con cuenta Google (Android/iOS)
  sign_in_with_apple: ^6.1.1      # Inicio de sesión nativo con Apple ID (Soporta FaceID/TouchID en iOS)
  passkeys: ^2.22.0                # Autenticación FIDO2 / WebAuthn nativa con Secure Enclave / StrongBox

  # ── Almacenamiento Seguro (Keychain / Keystore) ─────────────────────────────
  flutter_secure_storage: ^9.2.2  # Almacenamiento cifrado en hardware para JWT (AES / Keychain)

  # ── Animaciones (UI/UX) ─────────────────────────────────────────────────────
  rive: ^0.14.11                  # State Machines interactivos (avatar, botones líquidos)
  lottie: ^3.1.2                  # Microinteracciones vectoriales JSON (onboarding, éxito)
  audioplayers: ^6.1.0            # Feedback sonoro corto (éxito/error/clic) sincronizado con háptica
  animations: ^2.0.11             # Transiciones Material Motion (Fade Through / Shared Axis)
  flutter_animate: ^4.5.0         # Micro-interacciones declarativas (fade/slide/scale encadenados)

  # ── Componentes modernos / UX premium ───────────────────────────────────────
  skeletonizer: ^1.4.2            # Placeholders "skeleton" en carga (sensación de app pulida)
  fl_chart: ^0.69.0               # Gráficas profesionales (anillo de macros, progreso, barras)
  auto_size_text: ^3.0.0          # Texto autoajustable — previene overflows de layout
  hugeicons: ^0.0.11              # Set de iconos finos y modernos (superior a Material por defecto)

  # ── Offline-First (Isar) ────────────────────────────────────────────────────
  isar_community: ^3.3.2               # Base de datos local NoSQL reactiva (fork mantenido de isar; declara namespace → compatible AGP 8/9)
  isar_community_flutter_libs: ^3.3.2  # Binarios nativos de Isar para Flutter
  connectivity_plus: ^6.1.0       # Escucha de cambios de red para disparar la sincronización

  # ── Cliente HTTP y Red ──────────────────────────────────────────────────────
  dio: ^5.7.0                     # Cliente HTTP robusto con interceptores para JWT y reintentos

  # ── Certificate Pinning (SPKI) ──────────────────────────────────────────────
  crypto: ^3.0.3                  # SHA-256 del SubjectPublicKeyInfo (pin SPKI)
  asn1lib: ^1.5.3                 # Parseo ASN.1/DER del cert para extraer el SPKI

  # ── RASP (Runtime Application Self-Protection) ──────────────────────────────
  freerasp: ^7.5.1                # Talsec: root/jailbreak, emulador, debugger, Frida, tampering (7.x: proguard saneado p/ AGP nuevo)

  # ── Navegación ──────────────────────────────────────────────────────────────
  go_router: ^14.6.2              # Routing declarativo + intercepción nativa de deep links

  # ── Gestión de Estado (Riverpod) ────────────────────────────────────────────
  flutter_riverpod: ^2.5.1        # Gestión de estado reactiva, segura ante tipos y modular

  # ── Realtime de vigencia de membresía ───────────────────────────────────────
  supabase_flutter: ^2.8.0        # Canales PostgreSQL Realtime para desbloqueo instantáneo tras pago en mostrador

  # ── Utilidades e Interfaz Gráfica ───────────────────────────────────────────
  dartz: ^0.10.1                  # Programación funcional (Either<Failure, Success>) para Clean Arch
  equatable: ^2.0.5               # Comparación por valor de entidades y estados
  google_fonts: ^6.2.1            # Tipografía moderna (Outfit e Inter)
  flutter_svg: ^2.0.10            # Íconos vectoriales nítidos
  uuid: ^4.5.1                    # Generación de identificadores de sesión
  qr_flutter: ^4.1.0              # Renderizado de códigos QR nítidos para torniquetes
  url_launcher: ^6.3.0            # Lanzamiento de portal de pagos Stripe y checkout en navegador
  toastification: ^2.3.0          # Toasts dinámicos y fluidos estilo nativo iOS / Dynamic Island
  flutter_local_notifications: ^18.0.1 # Programación y canales nativos de notificación Android/iOS
  path_provider: ^2.1.5           # Almacenamiento temporal de imágenes para attachments nativos
  path: ^1.9.0                    # Manipulación/canonicalización segura de rutas (anti path traversal)
  firebase_core: ^3.8.0           # Núcleo de Firebase para inicialización nativa en app
  firebase_messaging: ^15.1.6     # Recepción de notificaciones push remotes FCM / APNs
  watch_connectivity: ^0.2.9
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2            # Selección de foto de perfil desde la galería
  palette_generator: ^0.3.3+7
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Mock del adapter HTTP de Dio para tests de red sin sockets reales.
  http_mock_adapter: ^0.6.1
  # Codegen de Isar (genera los *.g.dart de las @Collection).
  #   Tras añadir/editar colecciones ejecuta:  dart run build_runner build --delete-conflicting-outputs
  isar_community_generator: ^3.3.2
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/rive/      # coloca aquí los .riv (avatar.riv, liquid_button.riv)
    - assets/lottie/    # coloca aquí los .json (success.json, onboarding.json)
    - assets/sounds/    # coloca aquí los .mp3/.wav (success.mp3, click.mp3, error.mp3)
